[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blocklight"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
blocklight = "blocklight.terminal:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blocklight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
